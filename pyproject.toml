[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-guard"
version = "0.2.0"
description = "Dependency-free semantic decisions for Unix and CI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sharvil Saxena"}]
dependencies = []

[project.scripts]
semdecide = "reflex_guard.cli:main"
reflex = "reflex_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
